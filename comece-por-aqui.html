}
*{box-sizing:border-box}
body{ margin:0; min-height:100vh; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); }
header{
  background:linear-gradient(135deg, var(--navy) 0%, #1792C0 100%);

p.sub{ color:var(--muted); font-size:14.5px; margin:0 0 28px; }
.player{

  aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; flex-direction:column;
