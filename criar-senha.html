<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar senha — ObraIA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230057a8'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='Arial,sans-serif' font-weight='bold' fill='white'%3EM%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#002B40; --blue:#1792C0; --sky:#5ba3d9;
  --bg:#f0f4f8; --card:#ffffff; --border:#dce3ea;
  --text:#2c3e50; --muted:#7f8c8d; --red:#e74c3c; --green:#27ae60;
  --shadow: 0 2px 12px rgba(26,60,94,.10);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.wrap{ width:100%; max-width:400px; }
.brand{ text-align:center; margin-bottom:22px; }
.brand .logo{ font-size:26px; font-weight:800; letter-spacing:-.5px; color:var(--navy); }
.brand .logo span{ color:var(--blue); }
.brand .tag{ font-size:12.5px; color:var(--muted); margin-top:4px; }
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  box-shadow:var(--shadow); padding:28px 26px;
}
h1{ font-size:19px; margin:0 0 4px; color:var(--navy); }
.sub{ font-size:13px; color:var(--muted); margin:0 0 20px; line-height:1.5; }
label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; color:var(--text); }
input[type=email], input[type=password]{
  width:100%; padding:11px 12px; border:1.5px solid var(--border); border-radius:8px;
  font-size:14.5px; font-family:inherit; outline:0; transition:.15s;
}
input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(23,146,192,.15); }
.btn{
  width:100%; padding:12px; border:0; border-radius:8px; font-size:15px; font-weight:700;
  cursor:pointer; transition:.15s; margin-top:18px; font-family:inherit;
}
.btn-primary{ background:var(--navy); color:#fff; }
.btn-primary:hover{ background:#013a56; }
.btn-primary:disabled{ opacity:.6; cursor:not-allowed; }
.msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin-top:14px; display:none; }
.msg.err{ background:#fdecea; color:#c0392b; border:1px solid #f5c6c0; display:block; }
.msg.ok{ background:#eafaf1; color:#1e7e42; border:1px solid #b7e4c7; display:block; }
.spinner{ text-align:center; color:var(--muted); font-size:13.5px; padding:20px 0; }
.footer-links{ text-align:center; margin-top:22px; font-size:11.5px; color:var(--muted); }
.footer-links a{ color:var(--muted); }
.hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">Obra<span>IA</span></div>
    <div class="tag">MAR ABERTO ENGENHARIA</div>
  </div>

  <div class="card" id="card">
    <div class="spinner" id="carregando">Verificando seu link...</div>
  </div>

  <div class="footer-links">
    ObraIA · plataforma da <a href="https://marabertoeng.com.br" target="_blank" rel="noopener">Mar Aberto Engenharia</a>
    · <a href="https://wa.me/5581997977068?text=Ol%C3%A1!%20Preciso%20de%20ajuda%20para%20criar%20minha%20senha%20no%20ObraIA." target="_blank" rel="noopener">Falar com o suporte</a>
  </div>
</div>

<script>
const SUPA_URL = "https://xcfqqpjljtnbamisqqvq.supabase.co";
const SUPA_KEY = "sb_publishable_a93QzqdJJ0uSooob6JSwAg_ETcbQ0KF";
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const card = document.getElementById("card");

// ═════════════════════════════════════════════════════════════════════════
// Esta página é o destino de DOIS links de e-mail diferentes:
//   1. Convite pós-compra (inviteUserByEmail) — primeiro acesso, sem senha.
//   2. Recuperação (resetPasswordForEmail) — "esqueci minha senha" ou reenvio
//      manual quando o convite expirou antes do clique.
// Nos dois casos o supabase-js, ao carregar, lê o token que veio no hash da
// URL (#access_token=...) e already estabelece a sessão sozinho. O trabalho
// desta página é só: 1) confirmar que a sessão existe, 2) pedir a senha nova,
// 3) chamar updateUser. Se a sessão NÃO existir — link expirado ou já usado —
// oferecemos reenvio na hora, em vez de deixar a pessoa travada.
// ═════════════════════════════════════════════════════════════════════════

function telaSenha(email){
  card.innerHTML = `
    <h1>Crie sua senha</h1>
    <p class="sub">Última etapa. Defina uma senha para acessar o ObraIA a partir de agora.</p>
    <form id="form">
      <label for="s1">Nova senha</label>
      <input type="password" id="s1" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
      <label for="s2">Confirme a senha</label>
      <input type="password" id="s2" placeholder="Digite novamente" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn btn-primary" id="btn">Salvar senha e entrar</button>
    </form>
    <div class="msg" id="msg"></div>`;
  const form = document.getElementById("form");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const s1 = document.getElementById("s1").value;
    const s2 = document.getElementById("s2").value;
    msg.className = "msg"; msg.textContent = "";
    if(s1 !== s2){
      msg.className = "msg err"; msg.textContent = "As senhas não coincidem.";
      return;
    }
    btn.disabled = true; btn.textContent = "Salvando...";
    try{
      const { error } = await sb.auth.updateUser({ password: s1 });
      if(error) throw error;
      msg.className = "msg ok"; msg.textContent = "Senha criada! Entrando...";
      setTimeout(() => { window.location.href = "dashboard.html"; }, 900);
    }catch(err){
      btn.disabled = false; btn.textContent = "Salvar senha e entrar";
      msg.className = "msg err";
      msg.textContent = "Não consegui salvar (" + (err.message || "erro") + "). Tente de novo.";
    }
  });
}

// ─── Trava contra pré-carregamento de e-mail ───────────────────────────────
// Alguns provedores (antivírus corporativo, alguns apps de e-mail) abrem o
// link sozinhos para "escanear" antes da pessoa clicar — e como o link só
// vale uma vez, ele já chega queimado, e o usuário só vê "link expirado" sem
// nunca ter clicado em nada. É provavelmente o que aconteceu com o Marco e a
// Vanessa: os dois pediram reenvio e o link morreu antes do clique deles.
// A correção (recomendada pela própria Supabase): o e-mail não aponta mais
// direto pro link de uso único — aponta pra ESTA tela, com o link real
// escondido num parâmetro. Só quando a PESSOA clica no botão é que o link
// de uso único é de fato acessado. Um robô de escaneamento carrega a página,
// não clica em botão — então não queima nada.
function telaConfirmar(confUrl){
  card.innerHTML = `
    <h1>Quase lá</h1>
    <p class="sub">Por segurança, confirme com um clique para continuar criando sua senha.</p>
    <button class="btn btn-primary" id="btnConf" type="button">Confirmar e continuar</button>`;
  document.getElementById("btnConf").addEventListener("click", () => {
    window.location.href = confUrl;
  });
}

function telaExpirado(){
  card.innerHTML = `
    <h1>Este link não é mais válido</h1>
    <p class="sub">Links de acesso são de uso único e expiram por segurança. Sem problema —
      informe o e-mail da sua compra que mandamos um novo na hora.</p>
    <form id="formR">
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
      <button type="submit" class="btn btn-primary" id="btnR">Reenviar link de acesso</button>
    </form>
    <div class="msg" id="msgR"></div>
    <p class="hint">O link chega em até 2 minutos. Confira também a caixa de spam/lixo eletrônico.</p>`;
  document.getElementById("formR").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const btnR = document.getElementById("btnR");
    const msgR = document.getElementById("msgR");
    btnR.disabled = true; btnR.textContent = "Enviando...";
    msgR.className = "msg"; msgR.textContent = "";
    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/criar-senha.html"
      });
      if(error) throw error;
      msgR.className = "msg ok";
      msgR.textContent = "Se este e-mail tiver uma compra ativa, o link chega em instantes.";
      btnR.textContent = "Enviado";
    }catch(err){
      btnR.disabled = false; btnR.textContent = "Reenviar link de acesso";
      msgR.className = "msg err";
      msgR.textContent = "Não consegui enviar agora. Tente de novo em instantes.";
    }
  });
}

(async () => {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
  const query = new URLSearchParams(location.search);

  // Se o e-mail já veio no formato "clique para confirmar" (ver telaConfirmar
  // acima), o link de uso único fica aqui, intocado, até a pessoa clicar.
  const confUrl = query.get("confirmation_url");
  if(confUrl){
    telaConfirmar(confUrl);
    return;
  }

  // Erros de link (expirado, já usado, inválido) chegam pela Supabase como
  // parâmetros no hash OU na query string, dependendo da rota — cobrimos as
  // duas formas antes de checar a sessão.
  const erro = hash.get("error") || query.get("error") ||
               hash.get("error_code") || query.get("error_code");

  if(erro){
    telaExpirado();
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if(session){
    telaSenha(session.user.email);
  } else {
    telaExpirado();
  }
})();
</script>
</body>
</html>
