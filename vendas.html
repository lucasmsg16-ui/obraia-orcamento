<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando…</title>
<!-- ══════════════════════════════════════════════════════════════════════════
     A página passou a se chamar diagnostico.html. Este arquivo continua aqui
     de propósito: o endereço /vendas.html já foi divulgado (anúncios, e-mail,
     mensagens), e apagá-lo transformaria cada um desses links num 404.

     São três camadas de redirecionamento porque o GitHub Pages é um servidor
     estático — ele não emite um 301 de verdade, então o melhor possível é:
       1. canonical  → diz ao Google qual é o endereço oficial;
       2. meta refresh → funciona mesmo com JavaScript desligado;
       3. location.replace → instantâneo e, por usar replace em vez de href,
          não deixa esta página no histórico (o "voltar" do navegador não
          prende o usuário num laço entre as duas URLs).
     ══════════════════════════════════════════════════════════════════════════ -->
<link rel="canonical" href="https://marabertoeng.com.br/diagnostico.html">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=diagnostico.html">
<script>location.replace("diagnostico.html" + location.search + location.hash);</script>
<style>
body{background:#050d1a;color:#8fa9c6;font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
a{color:#37d5c3}
</style>
</head>
<body>
  <p>Levando você para o diagnóstico…<br>
     <a href="diagnostico.html">Clique aqui se não for automático</a></p>
</body>
</html>
